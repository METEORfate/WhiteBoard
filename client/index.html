<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>协作白板 · 支持离线与多人实时同步</title>
    <meta name="description" content="支持多人在线实时协作、断网离线编辑与自动重连合并的白板" />
    <link rel="stylesheet" href="/client/css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Crect x='5' y='6' width='6' height='6' rx='1.5' fill='white'/%3E%3Ccircle cx='16.5' cy='9' r='3' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="8" height="8" rx="2" />
            <circle cx="17" cy="7" r="4" />
            <path d="M3 17h8M3 21h5M17 13v8M13 17h8" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-name">协作白板</span>
        <span class="brand-tag">离线可用</span>
      </div>

      <div class="room-bar">
        <label for="room-input">房间</label>
        <input id="room-input" type="text" spellcheck="false" maxlength="64" autocomplete="off" />
        <button id="copy-link" class="ghost-btn" title="复制当前房间链接">复制链接</button>
      </div>

      <div class="spacer"></div>

      <div class="members" id="members" aria-label="在线成员"></div>

      <div class="status" id="status" data-state="connecting">
        <i class="dot"></i>
        <span id="status-text">连接中…</span>
      </div>

      <button id="debug-toggle" class="icon-btn" title="同步调试面板" aria-label="同步调试面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 17l4-6 3 4 3-7 4 9" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M4 21h16" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <main class="stage">
      <aside class="toolbar" id="toolbar" aria-label="工具栏">
        <button class="tool is-active" data-tool="select" title="选择 (V)" aria-label="选择">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 3l14 8-6 1.5L10 20 5 3z" stroke-linejoin="round" />
          </svg>
        </button>
        <button class="tool" data-tool="rect" title="矩形 (R)" aria-label="矩形">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="5" width="16" height="14" rx="2" />
          </svg>
        </button>
        <button class="tool" data-tool="ellipse" title="椭圆 (O)" aria-label="椭圆">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <ellipse cx="12" cy="12" rx="8" ry="6.5" />
          </svg>
        </button>
        <button class="tool" data-tool="text" title="文本 (T)" aria-label="文本">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M5 6h14M12 6v13M9 19h6" stroke-linecap="round" />
          </svg>
        </button>

        <div class="tool-divider"></div>

        <button class="tool" id="undo-btn" title="撤销 (Ctrl+Z)" aria-label="撤销">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 7L4 12l5 5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 12h9a6 6 0 016 6v1" stroke-linecap="round" />
          </svg>
        </button>
        <button class="tool" id="redo-btn" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M15 7l5 5-5 5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 12h-9a6 6 0 00-6 6v1" stroke-linecap="round" />
          </svg>
        </button>
        <button class="tool" id="delete-btn" title="删除选中 (Delete)" aria-label="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="tool-divider"></div>

        <button class="tool zoom-btn" id="zoom-btn" title="重置视图 (Ctrl+0)">100%</button>
      </aside>

      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="board"></canvas>
        <div class="presence-layer" id="presence-layer" aria-hidden="true"></div>
        <div class="text-editor-wrap" id="text-editor-wrap" hidden>
          <textarea id="text-editor" rows="1" spellcheck="false" placeholder="输入文本…"></textarea>
        </div>
        <div class="hint-bar" id="hint-bar">
          双击文本可编辑 · 空格/中键拖拽平移 · 滚轮缩放
        </div>
      </div>

      <aside class="inspector" aria-label="样式面板">
        <h3>样式</h3>

        <div class="field">
          <label for="fill-input">填充</label>
          <div class="row">
            <input type="color" id="fill-input" value="#dbeafe" />
            <button class="chip" id="fill-none" title="设为透明">透明</button>
          </div>
        </div>

        <div class="field">
          <label for="stroke-input">描边</label>
          <input type="color" id="stroke-input" value="#1e293b" />
        </div>

        <div class="field">
          <label for="stroke-width-input">线宽</label>
          <div class="row">
            <input type="range" id="stroke-width-input" min="0" max="16" step="1" value="2" />
            <output id="stroke-width-out">2</output>
          </div>
        </div>

        <div class="field">
          <label for="font-size-input">字号</label>
          <div class="row">
            <input type="range" id="font-size-input" min="10" max="96" step="1" value="20" />
            <output id="font-size-out">20</output>
          </div>
        </div>

        <p class="panel-hint">选中图形后修改样式会立即同步给同房间其他成员。</p>

        <div class="selection-card" id="selection-card">
          <span class="muted">未选中图形</span>
        </div>
      </aside>
    </main>

    <section class="debug" id="debug" hidden aria-label="同步调试面板">
      <header>
        <strong>同步调试</strong>
        <button id="debug-close" class="icon-btn small" aria-label="关闭">×</button>
      </header>
      <dl>
        <dt>连接状态</dt><dd id="dbg-state">-</dd>
        <dt>serverSeq</dt><dd id="dbg-seq">-</dd>
        <dt>待发队列</dt><dd id="dbg-queue">-</dd>
        <dt>图形 / 可见</dt><dd id="dbg-shapes">-</dd>
        <dt>收 / 发</dt><dd id="dbg-traffic">-</dd>
        <dt>bootEpoch</dt><dd id="dbg-epoch">-</dd>
        <dt>重连次数</dt><dd id="dbg-retry">-</dd>
      </dl>
      <label class="switch">
        <input type="checkbox" id="dbg-offline" />
        <span>模拟断网</span>
      </label>
      <div class="debug-log" id="debug-log"></div>
    </section>

    <div class="toast-host" id="toast-host"></div>

    <script type="module" src="/client/js/main.js"></script>
  </body>
</html>
